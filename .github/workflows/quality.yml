name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile maintained Python files
        run: >-
          python -m compileall -q
          __init__.py compat.py plugin.py user_messages.py adapters core gui
          processing_provider scripts tests

      - name: Check Ruff lint
        run: ruff check --no-cache .

      - name: Check Ruff formatting
        run: ruff format --check --no-cache .

      - name: Check Flake8
        run: flake8 . --exclude=legacy,__pycache__ --jobs 1

      - name: Scan runtime with Bandit
        run: >-
          bandit -q -r
          __init__.py compat.py plugin.py user_messages.py adapters core gui
          processing_provider scripts

      - name: Check tracked files for secrets
        run: >-
          git ls-files -z |
          xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -p no:cacheprovider tests/unit

      - name: Verify deterministic plugin package
        run: |
          python scripts/build_plugin_zip.py --output /tmp/plugin-first.zip
          python scripts/build_plugin_zip.py --output /tmp/plugin-second.zip
          cmp /tmp/plugin-first.zip /tmp/plugin-second.zip
          python -m zipfile -t /tmp/plugin-first.zip
