name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile maintained Python files
        run: >-
          python -m compileall -q
          __init__.py compat.py plugin.py user_messages.py adapters core gui
          processing_provider scripts tests

      - name: Check Ruff lint
        run: ruff check --no-cache .

      - name: Check Ruff formatting
        run: ruff format --check --no-cache .

      - name: Check Flake8
        run: flake8 . --exclude=legacy,__pycache__ --jobs 1

      - name: Scan runtime with Bandit
        run: >-
          bandit -q -r
          __init__.py compat.py plugin.py user_messages.py adapters core gui
          processing_provider scripts

      - name: Check tracked files for secrets
        run: >-
          git ls-files -z |
          xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -p no:cacheprovider tests/unit

      - name: Verify deterministic plugin package
        run: |
          python scripts/build_plugin_zip.py --output /tmp/plugin-first.zip
          python scripts/build_plugin_zip.py --output /tmp/plugin-second.zip
          cmp /tmp/plugin-first.zip /tmp/plugin-second.zip
          python -m zipfile -t /tmp/plugin-first.zip
